services:
  meilisearch:
    image: getmeili/meilisearch:v1.7
    container_name: meilisearch
    environment:
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY}
    volumes:
      - ./data.ms:/meili_data.ms
    ports:
      - "7700:7700"

  api:
    build: .
    container_name: express-api
    ports:
      - "3001:3001"
    depends_on:
      - meilisearch
      - mysql
    environment:
      - PORT=${PORT}
      - MEILI_HOST=${MEILI_HOST}
      - MEILI_API_KEY=${MEILI_API_KEY}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=${DB_HOST}
    volumes:
      - .:/app
      - /app/node_modules
      - ./logs:/app/logs

  mysql:
    image: mysql:8.0
    container_name: mysql-nomu
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    platform: linux/amd64
    container_name: phpmyadmin-nomu
    restart: always
    ports:
      - "8080:80"
    environment:
      - PMA_HOST=${PMA_HOST}
      - PMA_USER=${PMA_USER}
      - PMA_PASSWORD=${PMA_PASSWORD}
    depends_on:
      - mysql

volumes:
  mysql-data:
